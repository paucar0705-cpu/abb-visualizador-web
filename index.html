<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Visualizador de ABB</title>
  <meta name="description" content="Visualizador interactivo de un Árbol Binario de Búsqueda (ABB).">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="encabezado contenedor">
    <h1>Visualizador de Árbol Binario de Búsqueda</h1>
    <p>Actividad 2 · DSM 4A</p>
  </header>

  <main class="contenedor">
    <section class="panel" aria-label="Controles">
      <form id="formulario" class="fila-entrada" autocomplete="off">
        <label for="valor">Valor</label>
        <input id="valor" type="number" inputmode="numeric" step="1" min="-999" max="999"
               placeholder="-999 a 999" aria-describedby="ayuda-valor">
        <span id="ayuda-valor" class="ayuda">Enteros de -999 a 999. Enter = Insertar.</span>
      </form>

      <!-- Los botones se generan desde js/ui.js (y luego la Parte B agrega los suyos). -->
      <div id="menu" class="menu"></div>

      <div class="fila-reproduccion">
        <label for="velocidad">Velocidad</label>
        <input id="velocidad" type="range" min="0.5" max="3" step="0.5" value="1">
        <output id="velocidad-texto" for="velocidad">1×</output>
        <button type="button" id="btn-cancelar" class="boton boton-cancelar" disabled>Cancelar (Esc)</button>
      </div>
    </section>

    <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
    <p id="camino" class="camino" hidden></p>

    <section id="lienzo" class="lienzo" aria-label="Dibujo del árbol">
      <svg id="arbol" role="img" aria-label="Árbol binario de búsqueda"></svg>
    </section>

    <ul class="leyenda" aria-label="Significado de los colores">
      <li><span class="muestra muestra-activo"></span>Comparando</li>
      <li><span class="muestra muestra-visitado"></span>Visitado</li>
      <li><span class="muestra muestra-encontrado"></span>Encontrado</li>
      <li><span class="muestra muestra-nuevo"></span>Nuevo</li>
      <li><span class="muestra muestra-eliminando"></span>Se elimina</li>
      <li><span class="muestra muestra-sucesor"></span>Sucesor / reemplazo</li>
    </ul>
  </main>

  <footer class="pie contenedor">
    Enteros entre -999 y 999 · sin duplicados · la raíz es el nivel 1
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
